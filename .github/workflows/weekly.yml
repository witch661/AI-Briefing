name: Weekly AI News Brief

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-microhei ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch RSS news
        run: python scripts/fetch_news.py

      - name: Generate PDF briefing
        run: python scripts/generate_pdf.py

      - name: Generate AI read-aloud video
        run: python scripts/generate_video.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weekly_news.json downloads/
          git diff --cached --quiet || git commit -m "chore: update weekly AI news $(date +\%Y-\%m-\%d)"
          git push
